#status{display:flex;gap:6px;flex-wrap:wrap;background:#d4d0c8;border-top:2px solid #fff;padding:3px 6px;font-size:11px}
#status span{border:1px solid;border-color:#808080 #fff #fff #808080;padding:1px 8px}
#status .demo{background:#c00;color:#fff;font-weight:700}
.win{position:absolute;max-width:100%;max-height:calc(100% - 10px);display:flex;flex-direction:column;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;box-shadow:1px 1px 0 #000,6px 8px 18px rgba(0,0,0,.4)}
.tb{display:flex;justify-content:space-between;align-items:center;padding:3px 4px 3px 8px;color:#fff;font-weight:700;background:linear-gradient(90deg,#808080,#b9b5ad);touch-action:none;cursor:move;margin:2px}
.win.act .tb{background:linear-gradient(90deg,#0a246a,#a6caf0)}
.tb b{display:inline-block;width:18px;height:16px;margin-left:2px;text-align:center;line-height:14px;color:#000;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;cursor:pointer}
.bd{padding:8px;overflow:auto}
.win.mn .bd{display:none}
button,.bn{font:inherit;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;padding:4px 10px;cursor:pointer;color:#000}
button:active{border-color:#404040 #fff #fff #404040}
.tbr{display:flex;gap:4px;flex-wrap:wrap;padding-bottom:6px;border-bottom:1px solid #808080;margin-bottom:6px}
.pl{background:#0a246a;color:#fff;padding:2px 8px;margin-bottom:6px;font-weight:700}
.tw{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;overflow:auto;max-height:300px}
table{border-collapse:collapse;width:100%}
th{background:#d4d0c8;text-align:left;padding:3px 8px;border:1px solid;border-color:#fff #808080 #808080 #fff;font-weight:400;white-space:nowrap;position:sticky;top:0}
td{padding:3px 8px;white-space:nowrap;border-bottom:1px solid #eee}
tr.sel td{background:#0a246a;color:#fff}
.fl{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
input,select{font:inherit;background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:3px 5px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px;margin-bottom:10px}
.bn{text-align:center;padding:10px 4px;line-height:1.3}
.bn i{font-style:normal;font-size:20px;display:block}
fieldset{border:2px groove #fff;margin:0 0 8px;padding:8px}
legend{font-weight:700;color:#0a246a}
.hd{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.hd img{height:46px;width:auto}
.hd b{font-size:16px;letter-spacing:2px;color:#0a246a}
.r{text-align:right}
.tot td{font-weight:700;border-top:2px solid #000}
dialog{padding:8px;background:#d4d0c8;border:2px solid;border-color:#fff #404040 #404040 #fff;width:min(460px,94vw);color:#000}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h3{margin:0 0 8px;background:#0a246a;color:#fff;padding:3px 8px;font-size:12px}
dialog label{display:block;margin-bottom:6px}dialog input,dialog select{display:block;width:100%}
.act2{display:flex;gap:6px;justify-content:flex-end;margin-top:8px}
.sum{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px;margin-bottom:10px}
.sum div{background:#fff;border:2px solid;border-color:#808080 #fff #fff #808080;padding:6px 8px}
.sum b{display:block;font-size:16px;color:#0a246a}
.prn{display:none}
@media(max-width:700px){.win{left:0!important;top:0!important;width:100%!important;max-height:100%}body{font-size:13px}#desk{background-size:230px}}
@media print{
 body>*{display:none!important}
 body{background:#fff}
 body .prn{display:block!important;font:12px Tahoma,Arial}
 .prn table th{position:static;border:1px solid #000}
 .prn table td{border:1px solid #000}
}
.prn .ph{display:flex;gap:12px;align-items:center;border-bottom:3px double #0a246a;padding-bottom:8px;margin-bottom:10px}
.prn .ph img{height:56px}
.prn .ph b{font-size:18px;color:#0a246a;letter-spacing:1px}
.prn .pf{margin-top:12px;border-top:1px solid #0a246a;padding-top:4px;font-size:11px;color:#0a246a}
</style>
</head>

 else{try{const no=await nextNo(CTR[k]);const extra=k=='leads'?{company:'',age:'',gst:'',gender:'',consent:true,statusHistory:[{stage:d.status||'New leads',at:new Date().toISOString(),by:'import'}],status:'New leads'}:(k=='services'?{active:'Yes'}:{});
  await FB.addDoc(FB.collection(DB,COLL[k]),{source:'import',createdAt:new Date().toISOString(),[IDF[k]]:no,...extra,...d})}catch(x){alert('Row '+(ri+1)+' failed: '+x.message)}}
 }all()};

function loginWin(){win('w-login','Sign in · '+CO.n,()=>`<div class="hd"><img src="${LOGO}"><div><b>${CO.n}</b><br>Classic Management Dashboard</div></div><div class="fl" style="flex-direction:column;align-items:stretch"><label>Email <input id="lem" type="email" style="width:100%" autocomplete="username"></label><label>Password <input id="lpw" type="password" style="width:100%" autocomplete="current-password"></label><div id="lerr" style="color:#c00"></div><div class="act2"><button onclick="demo()">Preview with demo data</button><button onclick="signin()"><b>Sign in (live data)</b></button></div></div><div style="margin-top:6px;font-size:11px">Live mode syncs instantly between laptop and mobile. Demo mode uses sample data and saves nothing.</div>`,420)}
async function signin(){const em=$('#lem').value.trim(),pw=$('#lpw').value;$('#lerr').textContent='Signing in...';
try{if(!FB){const[a,f,au]=await Promise.all([import('https://www.gstatic.com/firebasejs/12.7.0/firebase-app.js'),import('https://www.gstatic.com/firebasejs/12.7.0/firebase-firestore.js'),import('https://www.gstatic.com/firebasejs/12.7.0/firebase-auth.js')]);
const app=a.initializeApp({apiKey:'AIzaSyB6W4VpjemO1aI',authDomain:'udecs-store.firebaseapp.com',projectId:'udecs-store',appId:'1:859203239571:web:e541cc2e68f880efa41766'},'unick-dash');
FB={collection:f.collection,doc:f.doc,setDoc:f.setDoc,addDoc:f.addDoc,updateDoc:f.updateDoc,deleteDoc:f.deleteDoc,onSnapshot:f.onSnapshot,runTransaction:f.runTransaction};DB=f.getFirestore(app);AUTH=au.getAuth(app);FB.signIn=au.signInWithEmailAndPassword}
await FB.signIn(AUTH,em,pw);MODE='live';$('#w-login')&&$('#w-login').remove();
FB.onSnapshot(FB.collection(DB,'serviceLeads'),s=>{D.leads=s.docs.map(d=>({id:d.id,...d.data()}));all()});
FB.onSnapshot(FB.collection(DB,'unickServices'),s=>{D.services=s.docs.map(d=>({id:d.id,...d.data()}));if(!s.size)setTimeout(()=>{if(confirm('No services in dashboard yet. Add the 20 website services now?'))seedServices()},600);all()});
FB.onSnapshot(FB.collection(DB,'unickCustomers'),s=>{D.customers=s.docs.map(d=>({id:d.id,...d.data()}));all()});
run('home')}catch(x){$('#lerr').textContent=x.message}}
function demo(){MODE='demo';demoData();const e=$('#w-login');e&&e.remove();run('home');stat()}
// ---------- boot ----------
const h=location.hash.replace('#','');
if(h.startsWith('demo')){demo();const w=h.split('=')[1];if(w&&w!=='home')run(w==='pay'?'pay':w)}
else loginWin();
stat();
</script>
</body>
</html>
